name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
      - run: moon fmt --check
      - run: moon check --deny-warn --target ${{ matrix.target }}
      - run: moon build --deny-warn --target ${{ matrix.target }}
      - run: moon test --deny-warn --target ${{ matrix.target }}
      - run: moon run examples/basic --target ${{ matrix.target }}
      - run: moon run examples/codecs --target ${{ matrix.target }}

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hustcer/setup-moonbit@v1
      - run: moon package --list
